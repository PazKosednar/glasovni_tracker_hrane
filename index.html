<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kalko</title>
  <meta name="description" content="Hiter dnevnik kalorij: skeniranje črtne kode, slika hrane z AI prepoznavo.">
  <meta name="theme-color" content="#f6f7fb">
  <!-- iPhone: “Dodaj na začetni zaslon” -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kalko">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button class="icon-btn" id="prevDay" aria-label="Prejšnji dan">‹</button>
    <div class="date-wrap">
      <div class="app-name">Kalko</div>
      <button class="date" id="dateLabel">Danes</button>
    </div>
    <button class="icon-btn" id="nextDay" aria-label="Naslednji dan">›</button>
  </header>

  <main id="main">
    <!-- Povzetek dneva -->
    <section class="card summary">
      <div class="ring-wrap">
        <svg viewBox="0 0 120 120" class="ring" aria-hidden="true">
          <circle cx="60" cy="60" r="52" class="ring-bg"/>
          <circle cx="60" cy="60" r="52" class="ring-fg" id="ringFg"/>
        </svg>
        <div class="ring-text">
          <div class="ring-num" id="kcalLeft">0</div>
          <div class="ring-sub" id="kcalLeftLabel">kcal ostane</div>
        </div>
      </div>
      <div class="summary-side">
        <div class="stat"><span>Pojedeno</span><b id="kcalEaten">0</b></div>
        <div class="stat"><span>Cilj</span><b id="kcalGoal">0</b></div>
        <div class="macros" id="macros"></div>
      </div>
    </section>

    <!-- Teža -->
    <button class="card weight-card" id="weightCard"></button>

    <!-- Obroki -->
    <div id="meals"></div>
    <div class="bottom-space"></div>
  </main>

  <!-- Hitri gumbi -->
  <nav class="dock" aria-label="Glavni meni">
    <button class="dock-btn" id="btnSearch">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
      <span>Išči</span>
    </button>
    <button class="dock-btn" id="btnWeight">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M7.5 10a5.5 5.5 0 0 1 9 0"/><path d="M12 10.5l1.6-2.4"/></svg>
      <span>Teža</span>
    </button>
    <button class="dock-scan" id="btnScan" aria-label="Skeniraj črtno kodo">
      <svg viewBox="0 0 24 24"><path d="M3 7.5V6a3 3 0 0 1 3-3h1.5M16.5 3H18a3 3 0 0 1 3 3v1.5M21 16.5V18a3 3 0 0 1-3 3h-1.5M7.5 21H6a3 3 0 0 1-3-3v-1.5"/><path d="M7.5 8v8M10.5 8v8M13.5 8v8M16.5 8v8" class="bars"/></svg>
    </button>
    <button class="dock-btn" id="btnPhoto">
      <svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7.5 6.5H5A2.5 2.5 0 0 0 2.5 9v8.5A2.5 2.5 0 0 0 5 20h14a2.5 2.5 0 0 0 2.5-2.5V9A2.5 2.5 0 0 0 19 6.5h-2.5z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span>Slika</span>
    </button>
    <button class="dock-btn" id="btnSettings">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>
      <span>Nastavitve</span>
    </button>
  </nav>

  <!-- Skriti input za fotografijo (odpre kamero na iPhonu) -->
  <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="labelInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="importInput" accept="application/json" hidden>

  <!-- Spodnji list (sheet) – vsebino polni app.js -->
  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden>
    <div class="sheet-handle"></div>
    <div id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
